<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chuyên khoa – KMN Clinic</title>
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/public.css">
</head>
<body class="public" data-layout="public" data-active="chuyen-khoa">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-kmn mb-2">
          <li class="breadcrumb-item"><a href="trang-chu.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Chuyên khoa</li></ol></nav>
        <div class="row align-items-end g-3">
          <div class="col-lg-7"><h1 class="mb-2">Chuyên khoa</h1>
            <p class="text-muted-kmn mb-0">Chọn một khoa để xem bác sĩ thuộc khoa và lịch làm việc.</p></div>
          <div class="col-lg-5">
            <div class="input-group input-group-lg"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input class="form-control" id="timKhoa" placeholder="Tìm tên khoa..." aria-label="Tìm khoa" maxlength="50"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <!-- Mỗi thẻ: ten_khoa, mo_ta (KHOA), số bác sĩ, ảnh minh họa -->
        <div class="row g-4" id="dsKhoa"><div class="col-12"><div class="skeleton" style="height:220px"></div></div></div>
      </div>
    </section>

    <!-- Chi tiết khoa đang chọn: bác sĩ thuộc khoa + lịch 7 ngày tới -->
    <section class="section-sm pt-0">
      <div class="container">
        <div class="card-kmn p-3 p-md-4 d-none" id="chiTietKhoa">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div class="d-flex align-items-center gap-3"><span class="icon-circle ic-blue"><i class="bi bi-diagram-3"></i></span>
              <div><h2 class="h4 mb-0" id="ctTen"></h2><span class="text-muted-kmn small" id="ctPhu"></span></div></div>
            <a href="dat-lich.html" class="btn btn-primary" id="ctDatLich"><i class="bi bi-calendar2-plus me-1"></i>Đặt lịch khoa này</a>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="small text-muted-kmn"><tr><th>Bác sĩ</th><th>Lịch còn đặt được 7 ngày tới</th><th class="text-end">Thao tác</th></tr></thead>
              <tbody id="ctBacSi"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/cong-khai.js"></script>
  <script src="assets/js/pages/chuyen-khoa.js"></script>
</body>
</html>
