<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thuốc – KMN Clinic</title>
  <link rel="stylesheet" href="../assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-layout="admin" data-vai-tro="QuanTriVien,BacSi,ThuNgan" data-search="Tìm nhanh...">
  <div class="admin-shell" id="admin-shell">
    <div class="main">
      <div id="topnav"></div>
      <div class="content">
        <div class="page-head">
          <div><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Danh mục</li><li class="breadcrumb-item active">Thuốc</li></ol></nav>
            <h1>Thuốc</h1><span class="text-muted-kmn small">Tên + nhà sản xuất + hàm lượng không được trùng (RB23). Đơn giá > 0 (RB24), tồn kho ≥ 0 (RB25).</span></div>
          <button class="btn btn-primary d-none" id="btnThem"><i class="bi bi-plus-lg me-1"></i>Thêm thuốc</button>
        </div>
        <div class="card-kmn panel p-0">
          <div class="d-flex flex-wrap gap-2 p-3 pb-0">
            <div class="input-group" style="max-width:340px"><span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="oTim" class="form-control" placeholder="Tìm theo tên, nhà sản xuất hoặc mã" aria-label="Tìm kiếm"></div>
            <div class="form-check form-switch d-flex align-items-center gap-2 ms-1">
              <input class="form-check-input" type="checkbox" role="switch" id="locSapHet">
              <label class="form-check-label" for="locSapHet">Chỉ thuốc sắp hết <span id="nguong" class="text-muted-kmn"></span></label></div>
          </div>
          <div class="table-responsive mt-2"><table class="table table-kmn mb-0">
            <thead><tr><th>Mã</th><th>Tên thuốc</th><th>Nhà sản xuất</th><th class="text-end">Hàm lượng</th><th>Đơn vị</th><th class="text-end">Đơn giá</th><th class="text-end">Tồn kho</th><th class="text-end cot-thao-tac">Thao tác</th></tr></thead>
            <tbody id="bang"></tbody></table></div>
          <div class="p-3" id="phanTrang"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/danh-sach.js"></script>
  <script src="../assets/js/pages/thuoc.js"></script>
</body>
</html>
