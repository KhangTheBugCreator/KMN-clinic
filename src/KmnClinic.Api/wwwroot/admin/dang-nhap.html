<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập nhân viên – KMN Clinic</title>
  <link rel="stylesheet" href="../assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/public.css">
</head>
<body class="public">
  <div class="auth-wrap">
    <div class="auth-side">
      <img src="../assets/img/gioi-thieu.webp" alt="">
      <div class="auth-quote">
        <h2>Hệ thống quản lý nội bộ KMN Clinic</h2>
        <p class="mb-0 opacity-75">Quản trị viên, lễ tân, bác sĩ và thu ngân dùng chung một cửa đăng nhập.</p>
      </div>
    </div>
    <div class="auth-form">
      <div class="inner">
        <a href="../trang-chu.html"><img src="../assets/img/logo.png" class="logo mb-4" alt="KMN Clinic"></a>
        <!-- Tab chuyển loại tài khoản: khách hàng (Khach_hang) / nhân viên (Nhan_vien, trang nội bộ) -->
        <ul class="nav nav-pills mb-4 bg-sky-2 p-1 rounded-pill" role="tablist">
          <li class="nav-item flex-fill"><a class="nav-link rounded-pill text-center" href="../dang-nhap.html">Khách hàng</a></li>
          <li class="nav-item flex-fill"><a class="nav-link active rounded-pill text-center" href="dang-nhap.html">Nhân viên</a></li>
        </ul>
        <h1 class="h3 mb-1">Đăng nhập</h1>
        <p class="text-muted-kmn mb-4">Dùng số điện thoại đã đăng ký với phòng khám. Hệ thống tự mở trang theo chức vụ.</p>

        

        <div id="loginError" class="alert alert-danger d-flex gap-2 align-items-start small rounded-3 border-0 d-none" role="alert">
          <i class="bi bi-exclamation-circle mt-1"></i><span></span></div>

        <form id="formDangNhap" data-loai="nhan-vien" novalidate>
          <div class="mb-3"><label class="form-label" for="sdt">Số điện thoại</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-phone"></i></span>
              <input id="sdt" name="sdt" class="form-control" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="10 chữ số, ví dụ 0901234567" required></div></div>
          <div class="mb-2"><label class="form-label" for="mk">Mật khẩu</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input id="mk" name="mk" type="password" class="form-control" autocomplete="current-password" placeholder="Mật khẩu" required>
              <button class="btn btn-outline-secondary border" type="button" id="btnHienMk" aria-label="Hiện mật khẩu" style="border-radius:0 10px 10px 0"><i class="bi bi-eye"></i></button></div></div>
          <button class="btn btn-primary w-100 btn-lg mt-3" type="submit">Đăng nhập</button>
        </form>
        <p class="text-center small text-muted-kmn mt-4 mb-0"><i class="bi bi-info-circle me-1"></i>Quên mật khẩu? Liên hệ quản trị viên để được đặt lại.</p>
      </div>
    </div>
  </div>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/dang-nhap.js"></script>
</body>
</html>
