<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard thu ngân – KMN Clinic</title>
  <link rel="stylesheet" href="../assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-layout="admin" data-vai-tro="ThuNgan" data-search="Tìm nhanh...">
  <div class="admin-shell" id="admin-shell">
    <div class="main">
      <div id="topnav"></div>
      <div class="content">
        <div class="page-head">
          <div><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="dashboard-thu-ngan.html">Trang nội bộ</a></li><li class="breadcrumb-item active">Dashboard</li></ol></nav>
            <h1 id="loiChao">Xin chào</h1><span class="text-muted-kmn small" id="homNay"></span></div>
          <a class="btn btn-primary" href="hoa-don-cho-thu.html"><i class="bi bi-receipt me-1"></i>Hóa đơn chờ thu</a>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6 col-xl-3"><a class="text-decoration-none" href="hoa-don-cho-thu.html"><div class="card-kmn stat-card d-flex gap-3"><span class="icon-circle ic-red"><i class="bi bi-hourglass-split"></i></span>
            <div><div class="label">Chờ thanh toán</div><div class="value" id="tqCho">–</div><div class="sub" id="tqTienCho">&nbsp;</div></div></div></a></div>
          <div class="col-6 col-xl-3"><a class="text-decoration-none" href="lich-su-thanh-toan.html?homNay=1"><div class="card-kmn stat-card d-flex gap-3"><span class="icon-circle ic-green"><i class="bi bi-check2-circle"></i></span>
            <div><div class="label">Đã thu hôm nay</div><div class="value" id="tqDaThu">–</div><div class="sub">hóa đơn</div></div></div></a></div>
          <div class="col-6 col-xl-3"><div class="card-kmn stat-card d-flex gap-3"><span class="icon-circle ic-blue"><i class="bi bi-cash-stack"></i></span>
            <div><div class="label">Doanh thu hôm nay</div><div class="value" id="tqDoanhThu">–</div><div class="sub">Hóa đơn đã thanh toán</div></div></div></div>
          <div class="col-6 col-xl-3"><a class="text-decoration-none" href="lich-su-thanh-toan.html?homNay=1&amp;cuaToi=1"><div class="card-kmn stat-card d-flex gap-3"><span class="icon-circle ic-cyan"><i class="bi bi-person-check"></i></span>
            <div><div class="label">Do tôi thu hôm nay</div><div class="value" id="tqCuaToi">–</div><div class="sub">Hóa đơn tôi đã xác nhận</div></div></div></a></div>
        </div>

        <div class="row g-3">
          <div class="col-xl-7"><div class="card-kmn panel p-0" style="height:auto">
            <div class="panel-title p-3 pb-0"><h2>Hóa đơn chờ thanh toán</h2><a class="small" href="hoa-don-cho-thu.html">Xem tất cả</a></div>
            <div class="table-responsive mt-2"><table class="table table-kmn mb-0">
              <thead><tr><th>Mã HĐ</th><th>Khách hàng</th><th>Bác sĩ</th><th class="text-end">Tổng tiền</th><th class="text-end"></th></tr></thead>
              <tbody id="bang"></tbody></table></div>
          </div></div>
          <div class="col-xl-5"><div class="card-kmn panel" style="height:auto" id="chiTiet"></div></div>
          <div class="col-12"><div class="card-kmn panel">
            <div class="panel-title"><h2>Số hóa đơn đã thu theo giờ hôm nay</h2></div>
            <div class="chart-box" style="height:200px"><canvas id="chartThuNgan" aria-label="Số hóa đơn đã thu theo giờ" role="img"></canvas></div>
          </div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/vendor/chartjs/chart.umd.js"></script>
  <script src="../assets/vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="../assets/vendor/jspdf/jspdf.plugin.autotable.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/thu-ngan.js"></script>
  <script src="../assets/js/pages/dashboard-thu-ngan.js"></script>
</body>
</html>
