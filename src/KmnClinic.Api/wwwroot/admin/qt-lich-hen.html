<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch hẹn – KMN Clinic</title>
  <link rel="stylesheet" href="../assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">

<body class="admin" data-layout="admin" data-vai-tro="QuanTriVien" data-search="Tìm nhanh...">
  <div class="admin-shell" id="admin-shell">
    <div class="main">
      <div id="topnav"></div>
      <div class="content">
        <div class="page-head">
          <div><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="dashboard-quan-tri.html">Vận hành</a></li><li class="breadcrumb-item active">Lịch hẹn</li></ol></nav>
            <h1>Lịch hẹn</h1><span class="text-muted-kmn small">Theo dõi lịch hẹn của toàn phòng khám. Chỉ xem: xác nhận, hủy và tiếp nhận do lễ tân thực hiện.</span></div>
        </div>
        <div class="card-kmn panel p-0">
          <div class="d-flex flex-wrap gap-2 p-3 pb-0 align-items-center">
              <div class="input-group" style="max-width:300px"><span class="input-group-text"><i class="bi bi-search"></i></span>
                <input id="oTim" class="form-control" placeholder="Mã lịch hẹn, tên hoặc SĐT khách" aria-label="Tìm kiếm"></div>
              <input id="locNgay" type="date" class="form-control" style="width:auto" aria-label="Ngày khám">
              <div class="form-check ms-1"><input class="form-check-input" type="checkbox" id="tatCaNgay"><label class="form-check-label small" for="tatCaNgay">Mọi ngày</label></div>
              <select id="locTrangThai" class="form-select" style="width:auto" aria-label="Lọc theo trạng thái">
              <option value="">Tất cả trạng thái</option><option>Đã đặt</option><option>Đã xác nhận</option><option>Đã khám</option><option>Đã hủy</option></select>
              <select id="locBacSi" class="form-select" style="width:auto" aria-label="Lọc theo bác sĩ"><option value="">Tất cả bác sĩ</option></select>
          </div>
          <div class="table-responsive mt-2"><table class="table table-kmn mb-0">
            <thead><tr><th>Mã</th><th>Khách hàng</th><th>Bác sĩ · Ca · Phòng</th><th>Triệu chứng</th><th>Trạng thái</th><th>Đặt lúc</th></tr></thead>
            <tbody id="bang"></tbody></table></div>
          <div class="p-3" id="phanTrang"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/danh-sach.js"></script>

  <script src="../assets/js/pages/qt-lich-hen.js"></script>
