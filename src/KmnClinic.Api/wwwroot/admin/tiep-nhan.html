<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếp nhận khách – KMN Clinic</title>
  <link rel="stylesheet" href="../assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-layout="admin" data-vai-tro="LeTan" data-search="Tìm nhanh...">
  <div class="admin-shell" id="admin-shell">
    <div class="main">
      <div id="topnav"></div>
      <div class="content">
        <div class="page-head">
          <div><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="dashboard-le-tan.html">Tiếp đón</a></li><li class="breadcrumb-item active">Tiếp nhận khách</li></ol></nav>
            <h1>Tiếp nhận khách vãng lai</h1><span class="text-muted-kmn small">Khách không có lịch hẹn hôm nay. Chỉ chọn được bác sĩ đang trực (từ 30 phút trước giờ bắt đầu ca tới hết ca, RB41).</span></div>
          <a class="btn btn-soft" href="lich-hen.html"><i class="bi bi-calendar-check me-1"></i>Khách có hẹn</a>
        </div>
        <div class="row g-3">
          <div class="col-xl-7">
            <form class="card-kmn panel" style="height:auto" id="formVangLai" novalidate>
              <div class="panel-title"><h2>1. Khách hàng</h2><button type="button" class="btn btn-sm btn-soft" id="btnKhachMoi"><i class="bi bi-person-plus me-1"></i>Khách mới</button></div>
              <div id="khungTim">
                <div class="input-group"><span class="input-group-text"><i class="bi bi-phone"></i></span>
                  <input class="form-control" id="oTimKhach" placeholder="Số điện thoại, tên hoặc mã khách" aria-label="Tìm khách hàng" autocomplete="off"></div>
                <div id="ketQuaKhach" class="mt-2"></div>
              </div>
              <div id="khachDaChon" class="d-none"></div>
              <div id="canhBaoHen" class="d-none"></div>

              <div class="panel-title mt-4"><h2>2. Bác sĩ đang trực</h2><button type="button" class="btn btn-sm btn-soft" id="btnTaiBacSi" aria-label="Tải lại"><i class="bi bi-arrow-clockwise"></i></button></div>
              <div class="row g-2" id="dsBacSi"></div>

              <div class="panel-title mt-4"><h2>3. Triệu chứng</h2></div>
              <label class="visually-hidden" for="trieuChung">Triệu chứng</label>
              <textarea class="form-control" id="trieuChung" rows="3" maxlength="255" placeholder="Ví dụ: đau bụng vùng thượng vị từ sáng"></textarea>
              <div class="alert alert-danger small mt-3 d-none" id="loiForm" role="alert"></div>
              <div class="d-flex justify-content-end mt-3"><button type="submit" class="btn btn-primary" id="btnTao"><i class="bi bi-journal-plus me-1"></i>Tạo hồ sơ khám</button></div>
            </form>
          </div>
          <div class="col-xl-5">
            <div class="card-kmn panel" style="height:auto">
              <div class="panel-title"><h2>Đã tiếp nhận hôm nay</h2><span class="small text-muted-kmn" id="demHoSo"></span></div>
              <div id="dsHoSo"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/danh-sach.js"></script>
  <script src="../assets/js/le-tan.js"></script>
  <script src="../assets/js/pages/tiep-nhan.js"></script>
</body>
</html>
