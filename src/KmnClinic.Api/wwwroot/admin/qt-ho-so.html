            <h1>Hồ sơ khám</h1><span class="text-muted-kmn small">Hồ sơ khám của mọi bác sĩ. Chỉ xem: chẩn đoán và kê đơn do bác sĩ phụ trách thực hiện.</span></div>
        </div>
