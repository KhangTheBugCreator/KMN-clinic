<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu bác sĩ – KMN Clinic</title>
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/public.css">
</head>
<body class="public" data-layout="public" data-active="bac-si">
  <div id="site-header"></div>

  <main>
    <section class="page-hero pb-4">
      <div class="container">
        <nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-kmn mb-2">
          <li class="breadcrumb-item"><a href="trang-chu.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Bác sĩ</li></ol></nav>
        <h1 class="mb-2">Tra cứu bác sĩ</h1>
        <p class="text-muted-kmn mb-4">Tìm theo tên, lọc theo khoa hoặc ngày làm việc. Lịch hiển thị là lịch làm việc thật còn đặt được.</p>
        <!-- Bộ lọc: ten (LIKE ho_ten_nv), maKhoa, ngay (ngay_lam_viec) -->
        <form class="filter-bar row g-2 align-items-end" id="formLoc">
          <div class="col-md-4"><label class="form-label" for="locTen">Tên bác sĩ</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="locTen" name="q" placeholder="Ví dụ: Minh Anh" maxlength="50"></div></div>
          <div class="col-md-3"><label class="form-label" for="locKhoa">Chuyên khoa</label>
            <select class="form-select" id="locKhoa" name="maKhoa"><option value="">Tất cả</option></select></div>
          <div class="col-md-3"><label class="form-label" for="locNgay">Ngày làm việc</label><input type="date" class="form-control" id="locNgay" name="ngay"></div>
          <div class="col-md-2 d-grid"><button class="btn btn-primary">Lọc</button></div>
        </form>
      </div>
    </section>

    <section class="section-sm pt-3">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <span class="text-muted-kmn" id="tomTat"></span>
          <button type="button" class="btn btn-sm btn-soft d-none" id="xoaLoc"><i class="bi bi-x-circle me-1"></i>Xóa bộ lọc</button>
        </div>
        <!-- Thẻ bác sĩ: ảnh (duong_dan_anh, có ảnh dự phòng), họ tên, khoa + mô tả khoa, lịch còn đặt được (ngày, ca, phòng) -->
        <div class="row g-4" id="dsBacSi"><div class="col-12"><div class="skeleton" style="height:200px"></div></div></div>
        <div class="mt-4" id="phanTrang"></div>
      </div>
    </section>
  </main>

  <!-- Modal xem lịch làm việc của một bác sĩ (14 ngày) -->
  <div class="modal fade" id="lichModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content rounded-4 border-0">
      <div class="modal-header border-0"><h2 class="modal-title h5" id="lichTieuDe">Lịch làm việc</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
      <div class="modal-body pt-0">
        <p class="small text-muted-kmn mb-2">Các ca còn đặt được trong 14 ngày tới.</p>
        <div class="table-responsive"><table class="table week-table mb-0">
          <thead><tr><th>Ngày</th><th>Ca</th><th>Giờ</th><th>Phòng</th><th></th></tr></thead>
          <tbody id="lichBang"></tbody></table></div>
      </div>
    </div></div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/cong-khai.js"></script>
  <script src="assets/js/pages/bac-si.js"></script>
</body>
</html>
