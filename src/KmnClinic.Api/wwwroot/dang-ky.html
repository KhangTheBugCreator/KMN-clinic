<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – KMN Clinic</title>
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/public.css">
</head>
<body class="public" data-mau="1">
  <div class="auth-wrap">
    <div class="auth-side">
      <img src="assets/img/cham-soc-suc-khoe.webp" alt="">
      <div class="auth-quote">
        <h2>Tạo tài khoản để đặt lịch khám trực tuyến</h2>
        <p class="mb-0 opacity-75">Chỉ cần thông tin cơ bản, chưa tới một phút.</p>
      </div>
    </div>
    <div class="auth-form">
      <div class="inner" style="max-width:480px">
        <a href="trang-chu.html"><img src="assets/img/logo.png" class="logo mb-4" alt="KMN Clinic"></a>
        <h1 class="h3 mb-1">Đăng ký tài khoản</h1>
        <p class="text-muted-kmn mb-4">Các trường có dấu <span class="text-danger">*</span> là bắt buộc.</p>

        <!-- Các cột NOT NULL của Khach_hang: ho_ten_kh, ngay_sinh_kh, gioi_tinh_kh, sdt_kh; dia_chi_kh tùy chọn -->
        <form novalidate class="row g-3">
          <div class="col-12"><label class="form-label">Họ và tên <span class="text-danger">*</span></label>
            <input class="form-control" maxlength="50" value="Nguyễn Văn Bình"></div>
          <div class="col-sm-6"><label class="form-label">Ngày sinh <span class="text-danger">*</span></label>
            <input type="date" class="form-control" value="1995-04-20"></div>
          <div class="col-sm-6"><label class="form-label d-block">Giới tính <span class="text-danger">*</span></label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="gt" id="gtNam" checked><label class="btn btn-outline-primary" for="gtNam" style="border-radius:10px 0 0 10px">Nam</label>
              <input type="radio" class="btn-check" name="gt" id="gtNu"><label class="btn btn-outline-primary" for="gtNu" style="border-radius:0 10px 10px 0">Nữ</label></div></div>
          <div class="col-12"><label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
            <!-- Ví dụ trạng thái lỗi kiểm tra bằng JavaScript -->
            <input class="form-control is-invalid" inputmode="numeric" maxlength="10" value="090123">
            <div class="invalid-feedback">Số điện thoại phải gồm 10 chữ số, bắt đầu bằng 0.</div></div>
          <div class="col-12"><label class="form-label">Địa chỉ</label>
            <input class="form-control" maxlength="100" placeholder="Không bắt buộc"></div>
          <div class="col-sm-6"><label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
            <input type="password" class="form-control is-valid" value="matkhau123"></div>
          <div class="col-sm-6"><label class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
            <input type="password" class="form-control" value=""></div>
          <div class="col-12"><div class="form-text mt-0"><i class="bi bi-shield-check me-1"></i>Mật khẩu tối thiểu 8 ký tự.</div></div>
          <div class="col-12"><button class="btn btn-primary w-100 btn-lg" type="button">Tạo tài khoản</button></div>
        </form>
        <p class="text-center mt-4 mb-0 text-muted-kmn">Đã có tài khoản? <a href="dang-nhap.html" class="fw-semibold">Đăng nhập</a></p>
      </div>
    </div>
  </div>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
